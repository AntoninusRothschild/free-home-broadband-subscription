port: 7890
socks-port: 7891
allow-lan: true
mode: rule
log-level: info
proxies:
- name: Github LV 01 ATSRSD
  type: vless
  server: atomic-prase23893.my-vm.work
  port: 8088
  uuid: tmp_user
  udp: true
  tls: false
  skip-cert-verify: true
  network: ws
  ws-opts:
    path: /api
    headers:
      Host: queuev4.vk.com
proxy-groups:
- name: PROXIES
  type: select
  proxies:
  - AUTO
  - Github LV 01 ATSRSD
- name: AUTO
  type: url-test
  url: https://www.google.com/generate_204
  interval: 300
  proxies:
  - Github LV 01 ATSRSD
rules:
- MATCH,PROXIES
