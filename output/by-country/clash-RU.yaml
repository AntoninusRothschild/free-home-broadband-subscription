port: 7890
socks-port: 7891
allow-lan: true
mode: rule
log-level: info
proxies:
- name: Github RU 01 ATSRSD
  type: vless
  server: fbsv6.guardora.pro
  port: 443
  uuid: bc5ec86c-3e65-4272-994c-59a924c72a68
  udp: true
  tls: true
  skip-cert-verify: true
  servername: fbsv6.guardora.pro
  network: ws
  ws-opts:
    path: /ws
    headers:
      Host: fbsv6.guardora.pro
proxy-groups:
- name: PROXIES
  type: select
  proxies:
  - AUTO
  - Github RU 01 ATSRSD
- name: AUTO
  type: url-test
  url: https://www.google.com/generate_204
  interval: 300
  proxies:
  - Github RU 01 ATSRSD
rules:
- MATCH,PROXIES
